<HTML>
<HEAD>
<TITLE></TITLE>
<STYLE>
HTML, BODY {
  background-color: #FFFFFF;
  color: #000000;
  margin: 0;
  padding: 0;
  /*text-align: center;*/
  font-family: Tahoma, Arial, Helvetica, sans-serif;
  font-size: 12px;
  height: 100%;
}
#layout {
  min-height:100%;
  position:relative;
}
* html #layout {height: 100%;}
.container {
  clear: both;
  width: 90%;
  margin: auto;
}
/* ********** ********** ********** HEADER AREA START ********** ********** ********** */
.logo {
  float: left;
  width: 250px;
  height: 80px;
}
.hdr {
  margin-left: 250px;
  height: 80px;
  overflow: auto;

  /*background-color: #EEEEEE;*/
}
* html .hdr {margin-bottom: -2px;}
/* ********** ********** ********** HEADER AREA END ********** ********** ********** */
/* ********** ********** ********** CONTENT AREA START ********** ********** ********** */
.cleft {
  float: left;
  width: 210px;
  border-top: 2px solid #000000;
  padding: 5px 5px 5px 5px;
  overflow: auto;
}
* html .cleft {width: 220px;}
.cright {
  float: right;
  width: 210px;
  border-top: 2px solid #000000;
  padding: 5px 5px 5px 5px;
  overflow: auto;
}
* html .cright {width: 220px;}
.ccont {
  margin-left: 220px; 
  margin-right: 220px; 
  border-left: 2px solid #000000;
  border-right: 2px solid #000000;
}
.cnt {
  margin-left: 10px; 
  margin-right: 10px;
  text-align: left;
  border-left: 2px solid #000000;
  border-right: 2px solid #000000;
  padding: 10px 10px 10px 10px;
  /*min-height: 450px;*/
  min-height: 250px;
  overflow: auto;
}
* html .cnt {height: 250px; margin-left: 7px; margin-right: 7px;}
.cnt_top {
    width: 50%;
    height: 2px;
    margin-left: 10px;
}
* html .cnt_top {display: block; margin-left: 7px;}
.cnt_bottom {
    width: 50%;
    height: 2px;
    margin-right: 10px;
}
* html .cnt_bottom {display: block; margin-right: 10px;}
/* ********** ********** ********** CONTENT AREA END ********** ********** ********** */
/* ********** ********** ********** FOOTER AREA START ********** ********** ********** */
#footer {
  width: 100%;
  /*padding: 10px 5px 10px 5px;*/
  font-size: 0.9em;
  text-align: center;
  position: absolute;
  bottom: 0;
  /*overflow: auto;*/
  background-color: #EEEEEE;
}
/* ********** ********** ********** FOOTER AREA END ********** ********** ********** */
</STYLE>
</HEAD>
<BODY>
<DIV ID="layout">
  <DIV ID="footer">
      footer Copyright. Link. Text etc etc
  </DIV>
</DIV>
</BODY>
</HTML>
